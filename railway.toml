[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# EXACTLY "/health/live". Any near-miss — "/health", "/healthz" — has no endpoint and is therefore
# answered by the SPA fallback with 200 text/html, so the probe would pass forever even with the API
# completely broken. A healthcheck that returns HTML is misconfigured.
healthcheckPath = "/health/live"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Environment variables are set in Railway's dashboard, not here — no secrets in the repo:
#   ASPNETCORE_ENVIRONMENT = Production
#   ConnectionStrings__Postgres = Host=${{Postgres.PGHOST}};Port=${{Postgres.PGPORT}};
#                                 Database=${{Postgres.PGDATABASE}};Username=${{Postgres.PGUSER}};
#                                 Password=${{Postgres.PGPASSWORD}}
#   Auth__Providers__Google__ClientId      the Google Cloud web client's id (README, "Sign-in")
#   Auth__Providers__Google__ClientSecret  its secret (a secret variable; never committed)
#   The Google client must list https://<this domain>/api/auth/callback/google as a redirect URI.
#   Production refuses to start without both, with the stub placeholders, or with any
#   Auth__Providers__Google__*Endpoint override, and it refuses any leftover Identity__* variable
#   (the Phase 8 sign-in replaced the default user; delete any such variable).
#
# Compose that string from the addon's individual variables. Do NOT use ${{Postgres.DATABASE_URL}}:
# Railway exposes it as a postgresql:// URI and Npgsql cannot parse that form.
